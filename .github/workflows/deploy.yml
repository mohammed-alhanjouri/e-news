name: Deploy to InfinityFree

# Runs on every push to main, and can also be started by hand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Upload site via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      - name: Upload changed files to htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          # Files that must never be uploaded.
          # config/db.php is skipped so the server keeps its own
          # InfinityFree database login.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config/db.php
            *.sql
            README*.md
